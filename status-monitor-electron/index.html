<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Status Monitor - CAN 2.0B Web版</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Orbitron(科技标题) + Rajdhani(炫酷数字) + Inter(正文) + Noto Sans SC(中文) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Share+Tech+Mono&display=swap"
    media="print" onload="this.media='all'">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
</head>

<body>
  <div class="app-container">
    <!-- Header / Navigation Bar -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon"></div>
        <div class="logo-title">
          <h1>STATUS MONITOR</h1>
          <span class="subtitle">CAN 2.0B 自定义协议监控网关</span>
        </div>
      </div>

      <!-- Top Navigation Menu -->
      <nav class="app-nav">
        <button id="btn-monitor-mode" class="nav-item active">📊 实时监控</button>
        <button id="btn-layout-mode" class="nav-item">📐 布局设置</button>
        <button id="btn-toggle-info" class="nav-item">📟 信息日志</button>
        <button id="btn-toggle-alarm" class="nav-item active">📋 报警面板</button>
      </nav>

      <div class="header-info-group">
        <!-- Theme Select Dropdown -->
        <select id="select-theme-skin" class="select-theme-skin" title="切换系统主题">
          <option value="cyber" selected>🌌 科技蓝</option>
          <option value="emerald">🟢 翡翠绿</option>
          <option value="amber"> Amber 琥珀金</option>
          <option value="ruby">🔴 烈焰红</option>
        </select>

        <div class="system-clock" id="system-clock">2026-07-18 22:04:00</div>
        <div class="connection-status" id="conn-status">
          <span class="status-dot"></span>
          <span class="status-text">正在初始化...</span>
        </div>
      </div>
    </header>

    <!-- Sub Layout Toolbar (Shown only in Layout Settings Mode) -->
    <div id="layout-toolbar" class="layout-toolbar" style="display: none;">
      <div class="toolbar-group">
        <span class="toolbar-label">📂 模板管理:</span>
        <select id="select-template" class="select-layout-template">
          <option value="" disabled selected>载入预设模版...</option>
          <option value="submarine">🚢 核潜艇船显布局</option>
          <option value="building">🏢 写字楼垂直布局</option>
          <option value="warship">🛥️ 水面战舰甲板布局</option>
        </select>
        <select id="select-layout-slot" class="select-layout-template">
          <option value="" disabled selected>载入已存布局...</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Grid Snap Spacing Selector -->
      <div class="toolbar-group">
        <span class="toolbar-label">📐 网格对齐:</span>
        <select id="select-grid-snap" class="select-layout-template">
          <option value="1">自由吸附</option>
          <option value="5">5 px</option>
          <option value="10" selected>10 px</option>
          <option value="20">20 px</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group">
        <span class="toolbar-label">⚙️ 布局编辑:</span>
        <button id="btn-import-file" class="btn-layout-action secondary" title="从JSON文件导入布局">📥 导入</button>
        <input type="file" id="file-import-input" accept=".json" style="display: none;">
        <button id="btn-export-file" class="btn-layout-action secondary" title="导出布局为JSON文件">📤 导出</button>
        <button id="btn-add-region" class="btn-layout-action">＋ 新建房间</button>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group">
        <span class="toolbar-label">🔍 视图缩放:</span>
        <button id="btn-zoom-out" class="btn-layout-action secondary" title="缩小 (Ctrl + 滚轮向下)">－ 缩小</button>
        <span id="zoom-text" class="zoom-percent-text">100%</span>
        <button id="btn-zoom-in" class="btn-layout-action secondary" title="放大 (Ctrl + 滚轮向上)">＋ 放大</button>
        <button id="btn-zoom-reset" class="btn-layout-action secondary" title="重置为100%">适中</button>
      </div>

      <div class="toolbar-group end">
        <button id="btn-reset-layout" class="btn-layout-action secondary">↺ 重置</button>
        <button id="btn-save-layout" class="btn-layout-action success">✓ 保存当前</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <div class="radar-scan">
          <div class="scan-circle"></div>
          <div class="scan-line"></div>
        </div>
        <p class="empty-title">正在等待网关数据...</p>
        <p class="empty-desc">请在 Qt 端「打开设备」并配置设备映射映射列表</p>
      </div>

      <!-- Unplaced Dock (Only active when layout mode is enabled or coordinate mode is active) -->
      <div class="unplaced-dock" id="unplaced-dock" style="display: none;">
        <span class="dock-title">未摆放设备：</span>
        <div class="dock-container" id="unplaced-container"></div>
      </div>

      <!-- Device Grid / Canvas -->
      <div class="device-grid" id="device-grid" style="display: none;"></div>
    </main>

    <!-- Footer Logs -->
    <footer class="app-footer" id="app-footer">
      <div class="resize-handle" id="resize-handle"></div>
      <div class="log-header">
        <div class="log-title">
          <span class="log-icon"></span>
          📋 报警事件
        </div>
        <div class="log-actions">
          <button class="btn-clear" id="btn-clear-logs" title="清空报警日志">🧹 清空</button>
          <button class="btn-close-footer" id="btn-close-footer" title="关闭面板">✕</button>
        </div>
      </div>

      <!-- Alarm Event Logs -->
      <div class="log-list" id="log-list-alarm">
        <div class="log-item system">
          <span class="log-time">[系统时间]</span>
          <span class="log-content">等待连接到本地 Qt CANTool 消息服务器...</span>
        </div>
      </div>
    </footer>

    <!-- Right Drawer for Information Log -->
    <div id="info-log-drawer" class="info-log-drawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <span class="drawer-icon"></span>
          📟 信息日志 (已翻译)
        </div>
        <div class="drawer-actions">
          <button class="btn-clear" id="btn-clear-drawer-logs" title="清空信息日志">🧹 清空</button>
          <button class="btn-close-drawer" id="btn-close-drawer">✕</button>
        </div>
      </div>
      <div class="drawer-content" id="log-list-raw">
        <div class="log-item system">
          <span class="log-time">[系统时间]</span>
          <span class="log-content">等待接收实时设备翻译报文...</span>
        </div>
      </div>
    </div>

    <!-- Custom Modal Dialog for New Room -->
    <div id="modal-add-room" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>＋ 新建房间</h3>
          <button class="btn-modal-close" id="btn-modal-cancel-x">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="input-room-name">房间名称</label>
            <input type="text" id="input-room-name" placeholder="例如：1F - 研发测试中心" autocomplete="off">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-modal-action secondary" id="btn-modal-cancel">取消</button>
          <button class="btn-modal-action primary" id="btn-modal-confirm">创建</button>
        </div>
      </div>
    </div>

    <!-- Custom Modal Dialog for Rename Room -->
    <div id="modal-rename-room" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>✎ 修改房间名称</h3>
          <button class="btn-modal-close" id="btn-modal-rename-cancel-x">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="input-rename-room-name">房间名称</label>
            <input type="text" id="input-rename-room-name" placeholder="例如：1F - 研发测试中心" autocomplete="off">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-modal-action secondary" id="btn-modal-rename-cancel">取消</button>
          <button class="btn-modal-action primary" id="btn-modal-rename-confirm">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
